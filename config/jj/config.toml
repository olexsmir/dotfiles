#:schema https://jj-vcs.github.io/jj/latest/config-schema.json

[user]
name = "Oleksandr Smirnov"
email = "olexsmir@gmail.com"

[ui]
default-command = ["log", "-r", "stack()"]
editor = ["nvim", "+$line"]
pager = "delta"
diff-editor = ":builtin"
diff-formatter = ":git"

[signing]
backend = "ssh"
key = "~/.ssh/git-sign.pub"

[git]
private-commits = "private()"

[remotes]
upstream.auto-track-bookmarks = "main | master"
origin.auto-track-bookmarks = "*"

[aliases]
jj = []
e = ["edit"]
a = ["absorb"]
s = ["show"]
aba = ["abandon"]
llog = ["log", "-r", ".."]
tug = ["bookmark", "advance"]
push = ["git", "push"]
solve = ["resolve", "--tool", "mergiraf"]
stage = ["stack", "closest_merge(@)+:: ~ empty()"]
restack = ["rebase", "-o", "trunk()", "-s", "mutable_roots()", "--simplify-parents"]
stack = ["rebase", "-A", "trunk()", "-B", "closest_merge(@)", "-r"]

[revsets]
git-sign-on-push = "~signed() & mine()"
bookmark-advance-to = "heads(::@ & ~description(exact:'') & ~private():: & (~empty() | merges()))"

[revset-aliases]
"/" = "trunk()"
"private()" = "description(glob:'private:*') | description(glob:'wip:*')"
"stack()" = "ancestors(reachable(@, mutable()), 2)"
"mutable_roots()" = "roots(trunk()..) & mutable()"
"closest_merge(to)" = "heads(::to & merges())"

[templates]
git_push_bookmark = '"olex/" ++ change_id.shortest(4)'
draft_commit_description = "builtin_draft_commit_description_with_diff"

[template-aliases]
"format_timestamp(timestamp)" = "timestamp.ago()"

[fix.tools.stylua]
command = ["stylua", "-"]
patterns = ["glob:'**/*.lua'"]

[fix.tools.gofumpt]
command = ["gofumpt"]
patterns = ["glob:'**/*.go'"]

[fix.tools.goimports]
command = ["goimports"]
patterns = ["glob:'**/*.go'"]

[fix.tools.gleam]
command = ["gleam", "format", "--stdin"]
patterns = ["glob:'**/*.gleam'"]

[fix.tools.shfmt]
command = ["shfmt"]
patterns = ["glob:'**/*.sh'"]

[fix.tools.ormolu]
command = ["ormolu", "--no-cabal"]
patterns = ["glob:'**/*.hs'"]
